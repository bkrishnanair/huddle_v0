name: CI

on:
  push:
    branches: [ "main", "fix/**", "feat/**", "design/**", "codex/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check
      run: npx tsc --noEmit
      
    - name: Lint
      run: npm run lint

    - name: Env template drift
      # Value checks need real secrets and cannot run here. This verifies the
      # cheaper, CI-safe invariant: every process.env.X in the source is
      # documented in .env.example. Undocumented variables are how
      # RESEND_API_KEY and NEXT_PUBLIC_VAPID_KEY went unset for months.
      run: npm run preflight -- --check-template

    - name: Test
      run: npx vitest run

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Firestore rules
      run: npm run test:rules

    - name: Build
      run: npm run build
      env:
        # Build-time stub so the Firebase Admin SDK does not crash during
        # prerender. Must match .firebaserc and .env.local — CI never contacts
        # the project, but a mismatched id makes the config confusing to read.
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "huddle-dca59"
        FIREBASE_PROJECT_ID: "huddle-dca59"
