name: CI

on:
  push:
    branches: [ "main", "fix/**", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type Check
      run: npx tsc --noEmit
      
    - name: Lint
      run: npm run lint

    - name: Test
      run: npx vitest run

    - name: Build
      run: npm run build
      env:
        # Prevent Firebase Admin SDK from crashing during build
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "huddlev0git"
        FIREBASE_PROJECT_ID: "huddlev0git"
